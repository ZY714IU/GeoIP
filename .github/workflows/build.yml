
name: Build geoip files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 3"
  push:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      # 下载公开仓库中的 GeoLite2 数据库，并检查 HTTP 状态和文件大小
      - name: Download GeoLite2 databases
        run: |
          set -euo pipefail
          mkdir -p output

          download() {
            local url="$1"
            local file="$2"

            curl -fLsS --retry 3 \
              -o "./output/$file" \
              -w "$file HTTP=%{http_code} SIZE=%{size_download} bytes\n" \
              "$url"

            test -s "./output/$file"
          }

          download "https://raw.githubusercontent.com/ZY714IU/7/main/Maxmind/GeoLite2-ASN.tar.gz" "GeoLite2-ASN.tar.gz"
          download "https://raw.githubusercontent.com/ZY714IU/7/main/Maxmind/GeoLite2-ASN-CSV.zip" "GeoLite2-ASN-CSV.zip"
          download "https://raw.githubusercontent.com/ZY714IU/7/main/Maxmind/GeoLite2-Country.tar.gz" "GeoLite2-Country.tar.gz"
          download "https://raw.githubusercontent.com/ZY714IU/7/main/Maxmind/GeoLite2-Country-CSV.zip" "GeoLite2-Country-CSV.zip"

          echo "Download results:"
          ls -lh ./output

      # 解压数据库，并整理需要的文件
      - name: Prepare GeoLite2 databases
        run: |
          set -euo pipefail

          cp ./output/{*.gz,*.zip} ./

          unzip GeoLite2-Country-CSV.zip
          unzip GeoLite2-ASN-CSV.zip

          tar -xvzf GeoLite2-Country.tar.gz
          tar -xvzf GeoLite2-ASN.tar.gz

          cp GeoLite2-Country_*/*.mmdb ./output/
          cp GeoLite2-ASN_*/*.mmdb ./output/

          cp GeoLite2-Country-CSV_*/{GeoLite2-Country-Blocks-*,GeoLite2-Country-Locations-en,GeoLite2-Country-Locations-zh-CN}.csv ./output/
          cp GeoLite2-ASN-CSV_*/*.csv ./output/

          mkdir -p geolite2
          cp GeoLite2-Country-CSV_*/*.csv ./geolite2/
          cp GeoLite2-ASN-CSV_*/*.csv ./geolite2/

      - name: Build geoip files
        run: |
          go build -o GeoIP ./
          ./GeoIP convert -c ./config.json

      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install -v github.com/maxmind/mmdbverify@latest
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      - name: Generate sha256 checksum for dat files
        run: |
          cd ./output || exit 1
          for name in $(ls *.dat); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Generate sha256 checksum for mmdb files
        run: |
          cd ./output || exit 1
          for name in $(ls *.mmdb); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Keep required files
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          find . -type f \
          ! -name "Country-cn-private.mmdb" \
          ! -name "GeoLite2-ASN.mmdb" \
          -delete

      - name: Git push assets to "release" branch
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add geoip "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u geoip release

      - name: Purge jsdelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      - name: Remove some files to avoid publishing to GitHub release
        if: github.event_name != 'pull_request'
        run: |
          rm -rf ./output/*.{gz,zip}
          rm -rf ./output/GeoLite2-*.csv
          rm -rf ./output/GeoLite2-Country.mmdb
          rm -rf ./output/GeoLite2-*.sha256sum
          rm -rf ./output/{clash,dat,mrs,nginx,srs,surge,text}

      - name: Upload files to GitHub release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} --title "${{ env.RELEASE_NAME }}" ./output/*
